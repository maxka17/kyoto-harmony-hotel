<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kontakta Kyoto Harmony Hotel i Kyoto, Japan för frågor om boende, bokningar eller andra förfrågningar. Vi finns här för att hjälpa dig.">
    <title>Kontakta - Kyoto Harmony Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">KYOTO HARMONY</a>

        <nav id="main-navigation">
            <a href="index.html">HOME</a>
            <a href="boka.html">BOOK</a>
            <a href="hitta.html">FIND</a>
            <a href="kontakta.html" aria-current="page">CONTACT</a>
        </nav>

        <button 
            class="menu-toggle"
            type="button"
            aria-label="Öppna menyn"
            aria-expanded="false"
            aria-controls="main-navigation">
            <span class="hamburger"></span>
        </button>
    </header>

    <main>

        <section class="contact">

            <h1>CONTACT US</h1>

            <div class="contact-container">

                <div class="contact-info">

                    <h2>GET IN TOUCH</h2>

                    <p>
                        We are here to help with your stay at Kyoto Harmony Hotel.
                    </p>

                    <p>
                        <a href="tel:+81751234567">+81 75 123 4567</a> •
                    </p>

                    <p>
                        <a href="mailto:hello@kyotoharmony.jp">
                            hello@kyotoharmony.jp
                        </a>
                    </p>

            </div>

            <form class="contact-form">

                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" name="name" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>

                <button type="submit" class="button">
                    SEND MESSAGE
                </button>

            </form>
        
        </div>
    </section>
</main>

<footer> 

    <p>KYOTO HARMONY HOTEL</p>

    <p>Kyoto, Japan • Experience harmony</p>

    <p>
        <a href="tel:+81751234567">+81 75 123 4567</a> •
        <a href="mailto:hello@kyotoharmony.jp">
            hello@kyotoharmony.jp
        </a>
    </p>

</footer>

<script src="js/script.js"></script>

</body>
</html>
