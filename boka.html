<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Boka ditt rum på Kyoto Harmony Hotel i Kyoto, Japan. Välj datum, antal gäster och rumstyp för en harmonisk vistelse.">
    <title>Boka - Kyoto Harmony Hotel</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <header>
        <a href="index.html" class="logo">KYOTO HARMONY</a>

        <nav id="main-navigation">
            <a href="index.html">HOME</a>
            <a href="boka.html" aria-current="page">BOOK</a>
            <a href="hitta.html">FIND</a>
            <a href="kontakta.html">CONTACT</a>
        </nav>

        <button 
            class="menu-toggle"
            type="button"
            aria-label="Öppna menyn"
            aria-expanded="false"
            aria-controls="main-navigation">
            <span class="hamburger"></span>
        </button>
    </header>

    <main>

        <section class="booking">
            <h1>BOOK YOUR STAY</h1>

            <form class="booking-form">
                
                <div class="form-group">
                    <label for="check-in">CHECK-IN</label>
                    <input type="date" id="check-in" name="check-in">
                </div>

                <div class="form-group">
                    <label for="check-out">CHECK-OUT</label>
                    <input type="date" id="check-out" name="check-out">
                </div>

                <div class="form-group">
                    <label for="guests">GUESTS</label>
                    <input type="number" id="guests" name="guests" min="1" value="1">
                </div>

                <div class="form-group">
                    <label for="room-type">ROOM TYPE</label>
                    
                    <select id="room-type" name="room-type">
                        <option value="">Select a room</option>
                        <option value="harmony-room">Harmony Room</option>
                        <option value="zen-suite">Zen Suite</option>
                        <option value="kyoto-suite">Kyoto Suite</option>
                    </select>
                </div>

                <button type="submit" class="button">SEARCH ROOMS</button>

            </form>

            <p class="booking-help">
                Need help with your booking?
                <a href="kontakta.html">Contact us</a>
            </p>

        </section>

    </main>

    <footer>
        <p>KYOTO HARMONY HOTEL</p>

        <p>Kyoto, Japan • Experience harmony</p>

        <p>
            <a href="tel:+81751234567">+81 75 123 4567</a> •
            <a href="mailto:hello@kyotoharmony.jp">hello@kyotoharmony.jp</a>
        </p>

    </footer>

    <script src="js/script.js"></script>

</body>
</html>
